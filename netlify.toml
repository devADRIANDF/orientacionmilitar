# Orientación Militar: web estática + API del panel.
# La web está en sitio/ y no necesita compilación.
# Si cambias contenido, ejecuta antes `python3 herramientas/construir.py`.

[build]
  publish = "sitio"
  command = "echo 'Sin compilación: sitio/ ya está generado'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/panel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/panel"
  to = "/panel/"
  status = 301
